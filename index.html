<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temasek Polytechnic Interactive Showcase</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:black;
}

#videoContainer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

#backgroundVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    text-shadow:2px 2px 10px black;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
    letter-spacing:2px;
}

.subtitle{
    font-size:1.5rem;
    margin-bottom:40px;
}

.buttonPanel{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.touchButton{
    min-width:220px;
    padding:20px 30px;
    font-size:1.2rem;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.touchButton:hover{
    transform:scale(1.05);
}

.courses{
    background:#0066cc;
    color:white;
}

.student{
    background:#008855;
    color:white;
}

.campus{
    background:#9933cc;
    color:white;
}

.apply{
    background:#ff6600;
    color:white;
}

#popup{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70%;
    max-width:800px;
    background:rgba(0,0,0,0.9);
    color:white;
    padding:35px;
    border-radius:20px;
    display:none;
    text-align:center;
}

#popup h2{
    margin-bottom:20px;
    font-size:2rem;
}

#popup p{
    font-size:1.2rem;
    line-height:1.6;
}

.closeBtn{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
}

.qr{
    width:180px;
    margin-top:20px;
}

.footer{
    position:absolute;
    bottom:20px;
    left:0;
    width:100%;
    text-align:center;
    font-size:1rem;
}

</style>
</head>

<body>

<div id="videoContainer">

<video
id="backgroundVideo"
autoplay
muted
loop
playsinline>

<source src="/videos/tp-campus.mp4" type="video/mp4">

</video>

<div id="overlay">

<h1>TEMASEK POLYTECHNIC</h1>

<div class="subtitle">
Inspiring Tomorrow's Innovators
</div>

<div class="buttonPanel">

<button
class="touchButton courses"
onclick="showCourses()">
Courses
</button>

<button
class="touchButton student"
onclick="showStudentLife()">
Student Life
</button>

<button
class="touchButton campus"
onclick="showCampusTour()">
Campus Tour
</button>

<button
class="touchButton apply"
onclick="showApplyNow()">
Apply Now
</button>

</div>

<div class="footer">
Touch the screen to explore Temasek Polytechnic
</div>

</div>

<div id="popup">

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

<div id="popupExtra"></div>

<button
class="closeBtn"
onclick="closePopup()">
Close
</button>

</div>

</div>

<script>

function openPopup(title,text,extra=""){
    document.getElementById("popupTitle").innerHTML=title;
    document.getElementById("popupText").innerHTML=text;
    document.getElementById("popupExtra").innerHTML=extra;
    document.getElementById("popup").style.display="block";
}

function showCourses(){

openPopup(
"Courses",
"Explore diploma programmes in Engineering, Business, Design, Applied Science, Informatics & IT, and Humanities & Social Sciences."
);

}

function showStudentLife(){

openPopup(
"Student Life",
"Experience CCAs, overseas programmes, industry internships, competitions, leadership development and vibrant campus activities."
);

}

function showCampusTour(){

openPopup(
"Campus Tour",
"Discover learning spaces, innovation labs, maker spaces, sports facilities and collaborative student environments."
);

}

function showApplyNow(){

openPopup(
"Admissions",
"Scan the QR code below or visit the admissions website for programme and application information.",
'<img src="/images/tp-apply-qr.png" class="qr" alt="Admissions QR Code">'
);

}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

let idleTimer;

function resetIdle(){

clearTimeout(idleTimer);

idleTimer=setTimeout(function(){

closePopup();

},30000);

}

document.addEventListener("click",resetIdle);
document.addEventListener("touchstart",resetIdle);

resetIdle();

</script>

</body>
</html>
